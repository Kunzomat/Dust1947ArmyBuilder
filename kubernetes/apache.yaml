apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: dust1947
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: apache
          image: dust1947-php:8.2
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          volumeMounts:
            - name: backend
              mountPath: /var/www/html
      volumes:
        - name: backend
          hostPath:
            path: /mnt/d/private/apps/dust1947/backend
            type: Directory

---
apiVersion: v1
kind: Service
metadata:
  name: apache
  namespace: dust1947
spec:
  selector:
    app: apache
  ports:
    - name: http
      port: 8180
      targetPort: 80
  type: LoadBalancer