      - group [ref=f6e28]:
        - heading "Le builder complet" [level=2] [ref=f6e30] [cursor=pointer]
        - paragraph [ref=f6e31]: Construire une liste d'armée complète pour DUST 194∞, avec les règles de composition vérifiées au fur et à mesure.
        - heading "Les gestes essentiels" [level=3] [ref=f6e32]
        - list [ref=f6e33]:
          - listitem [ref=f6e34]: Sur la page d'accueil, donnez un nom à votre armée, choisissez un bloc et une limite de points, puis créez-la.
          - listitem [ref=f6e35]: Dans l'onglet « Ajouter des unités », filtrez par faction ou tapez un nom ou une compétence, puis ajoutez les unités. Le bouton « Voir la carte » ouvre la fiche d'une unité.
          - listitem [ref=f6e36]: L'onglet « Ma liste » range vos unités par peloton. Le bandeau du haut montre les points dépensés et dit si la liste est valide ; une alerte « À corriger » explique ce qui manque.
          - listitem [ref=f6e37]: "Un héros se rattache à une escouade ou pilote un véhicule avec le menu qui affiche « Seul ». De même, un véhicule Airmobile ou Air Assault (un Walker, par exemple) se place sur un hélicoptère Airlifter avec le menu qui affiche « Non transporté » : il s'affiche sous l'hélicoptère, et un Airlifter ne transporte qu'un seul véhicule."
          - listitem [ref=f6e38]: "« Partager » donne un lien : la personne qui l'ouvre reçoit une copie de votre liste. « Texte » la copie en texte, « PDF » crée un récapitulatif avec les cartes."
        - heading "À savoir" [level=3] [ref=f6e39]
        - list [ref=f6e40]:
          - listitem [ref=f6e41]: Vos listes sont gardées dans ce navigateur. Si vous changez d'appareil ou videz les données du navigateur, utilisez le lien de partage pour les retrouver.
          - listitem [ref=f6e42]: Les créations CONFIDENTIAL n'apparaissent que si vous cochez l'option à la création de l'armée.
      - group [ref=f6e43]:
        - heading "Les images des cartes" [level=2] [ref=f6e45] [cursor=pointer]
        - paragraph [ref=f6e46]: Chaque unité a une carte générée à partir de la base, que vous pouvez agrandir et télécharger en PNG. Son image dépend de ce que vous choisissez.
        - heading "Les gestes essentiels" [level=3] [ref=f6e47]
        - list [ref=f6e48]:
          - listitem [ref=f6e49]: "Ouvrez la fiche d'une unité : la carte est en haut, avec le bouton « Télécharger la carte (PNG) »."
          - listitem [ref=f6e50]: "Dans « Image de la carte générée », choisissez l'image : votre photo, la photo de la communauté, ou le pixel art. Sans rien choisir, la carte montre le pixel art de l'unité, ou une icône s'il n'existe pas encore."
          - listitem [ref=f6e51]: « Ajouter ma photo » permet d'envoyer votre propre figurine peinte et de la cadrer avec la souris.
          - listitem [ref=f6e52]: Les petites vignettes en pixel art dans les listes sont celles des unités qui ont une illustration.
        - heading "À savoir" [level=3] [ref=f6e53]
        - list [ref=f6e54]:
          - listitem [ref=f6e55]: "Vos photos et vos choix restent dans ce navigateur : ils ne sont ni envoyés ni partagés."
          - listitem [ref=f6e56]: « Mes images de la carte officielle » sert à garder vos propres scans pour votre usage personnel ; elles ne sont jamais mises en ligne.
      - group [ref=f6e57]:
        - heading "Le Shot Format" [level=2] [ref=f6e59] [cursor=pointer]
        - paragraph [ref=f6e60]: "Une version courte pour des parties de 30 à 45 minutes : un héros, un à quatre escouades et un véhicule, 40 points (4 points de plus pour le héros dans une armée de faction ou mercenaire)."
        - heading "Les gestes essentiels" [level=3] [ref=f6e61]
        - list [ref=f6e62]:
          - listitem [ref=f6e63]: "Choisissez un bloc et créez l'armée. Elle se présente en postes : unité de commandement, unités de combat, véhicule."
          - listitem [ref=f6e64]: Pour chaque poste, « Choisir » ouvre la liste des unités autorisées. Le bouton « i » à gauche d'une unité montre sa fiche sans quitter la liste.
          - listitem [ref=f6e65]: Le bandeau indique les points et si l'armée est complète ; la rubrique « Vérification » liste ce qui manque.
          - listitem [ref=f6e66]: Les boutons « Partager », « Fiche de partie », « PDF » et « Texte » servent à envoyer, imprimer ou copier votre liste.
        - heading "À savoir" [level=3] [ref=f6e67]
        - list [ref=f6e68]:
          - listitem [ref=f6e69]: Pas d'aéronef, pas d'avantage de peloton, pas de héros « surhumain » (Super Human), pas d'unité Strong Point.
      - group [ref=f6e70]:
        - heading "Ma collection" [level=2] [ref=f6e72] [cursor=pointer]
        - paragraph [ref=f6e73]: Noter les figurines que vous possédez, pour que vos listes tiennent compte de ce que vous avez vraiment.
        - heading "Les gestes essentiels" [level=3] [ref=f6e74]
        - list [ref=f6e75]:
          - listitem [ref=f6e76]: Dans « Ajouter des unités », choisissez un bloc (puis une sous-faction) et ajoutez avec le bouton « + » le nombre d'exemplaires que vous possédez.
          - listitem [ref=f6e77]: « Ce que je possède » liste votre collection, groupée par bloc et sous-faction (ou par type avec « Grouper par »). Cliquez sur un titre pour replier un groupe. Les cartes en haut de page résument chaque bloc ; cliquez sur l'une d'elles pour filtrer. « Liste » et « Grille » changent l'affichage.
          - listitem [ref=f6e78]: Dans la barre « Sauvegarde & import », « Ajouter les unités d'une liste » puis « Ajouter à ma collection » ajoute d'un coup toutes les unités d'une de vos listes.
          - listitem [ref=f6e79]: "Dans une liste d'armée, activez « Ma collection » : vous pouvez ne voir que vos unités, et on vous prévient quand la liste en demande plus que vous n'en avez. Ce n'est jamais bloquant."
        - heading "À savoir" [level=3] [ref=f6e80]
        - list [ref=f6e81]:
          - listitem [ref=f6e82]: "Votre collection reste dans ce navigateur. Pensez à l'exporter régulièrement avec « Exporter (fichier JSON) », dans la barre « Sauvegarde & import » : un navigateur peut vider ses données, surtout sur téléphone. Le fichier sert aussi à la copier sur un autre appareil."
          - listitem [ref=f6e83]: La collection n'existe pas dans le Shot Format.
      - group [ref=f6e84]:
        - heading "L'Atelier" [level=2] [ref=f6e86] [cursor=pointer]
        - paragraph [ref=f6e87]: Créer vos propres unités, factions et blocs pour DUST 194∞. Ce sont des créations de la communauté, non officielles, marquées CONFIDENTIAL.
        - heading "Les gestes essentiels" [level=3] [ref=f6e88]
        - list [ref=f6e89]:
          - listitem [ref=f6e90]: "Indiquez votre pseudo et un nom de projet : le pseudo sert de crédit sur chaque carte que vous créez."
          - listitem [ref=f6e91]: Dans « Unités », créez une unité (ou copiez une unité existante comme modèle), remplissez l'identité, les caractéristiques, les compétences et les armes. L'aperçu de la carte se met à jour sous le formulaire.
          - listitem [ref=f6e92]: "Pour les compétences, tapez quelques lettres : les compétences officielles apparaissent avec leur description. Si votre règle n'existe pas, « Créer comme règle inédite » l'ajoute et vous demande de la décrire."
          - listitem [ref=f6e93]: Quand c'est prêt, « Envoyer » exporte un fichier à poster dans le salon prévu du Discord. Il est relu avant publication.
        - heading "À savoir" [level=3] [ref=f6e94]
        - list [ref=f6e95]:
          - listitem [ref=f6e96]: "Votre projet reste dans ce navigateur tant que vous ne l'exportez pas : exportez-le pour le garder, et rechargez le fichier avec « Reprendre un projet » pour continuer."
          - listitem [ref=f6e97]: Dans le builder, les créations CONFIDENTIAL ne se voient que si l'option est cochée ; elles ne sont pas dans le Shot Format.
          - listitem [ref=f6e98]: Proposez uniquement vos propres créations, et des photos de vos propres figurines.
      - group [ref=f6e99]:
        - heading "Questions fréquentes" [level=2] [ref=f6e101] [cursor=pointer]
        - heading "Je ne vois pas de vignette sur une unité." [level=3] [ref=f6e102]
        - paragraph [ref=f6e103]: "Les vignettes sont celles du pixel art : une unité qui n'a pas encore d'illustration n'en a pas. Sa carte, elle, montre une icône par défaut."
        - 'heading "J''ai changé d''appareil : où sont mes listes et ma collection ?" [level=3] [ref=f6e104]'
        - paragraph [ref=f6e105]: Elles sont gardées dans le navigateur de l'ancien appareil. Utilisez le lien de partage pour une liste, et le fichier d'export pour la collection.
        - heading "Mes photos sont-elles envoyées quelque part ?" [level=3] [ref=f6e106]
        - paragraph [ref=f6e107]: Non. Elles restent dans votre navigateur et ne servent qu'à vos propres cartes.
        - heading "Quelque chose ne marche pas." [level=3] [ref=f6e108]
        - paragraph [ref=f6e109]: Rechargez la page avec Ctrl+F5. Si le problème persiste, dites-le sur le Discord en précisant l'appareil et le navigateur.
