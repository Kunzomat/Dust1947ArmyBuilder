        - heading "Comment ça marche" [level=1] [ref=f6e19]
        - paragraph [ref=f6e20]: "Une courte notice par onglet. Rien n'est envoyé sur un serveur : vos listes, votre collection et vos photos restent dans votre navigateur."
      - navigation "Sommaire" [ref=f6e21]:
        - link "Le builder complet" [ref=f6e22] [cursor=pointer]:
